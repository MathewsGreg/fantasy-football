<html lang="en">
<head>
<meta charset="utf-8" />

<title>Weekly Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f5f6f3; --surface: #ffffff; --surface-2: #eef1ec; --border: #dde1da;
    --text: #1b2420; --text-muted: #5b6660;
    --accent: #2f5d3a; --accent-contrast: #eaf3ec;
    --warn: #b8722a; --warn-bg: #f7ead9;
    --critical: #a33636; --critical-bg: #f6e1e1;
    --info: #35618c; --info-bg: #e3edf5;
    --shadow: 0 1px 2px rgba(20,30,20,.06), 0 4px 14px rgba(20,30,20,.05);
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121814; --surface: #1b231d; --surface-2: #212b23; --border: #303c33;
      --text: #e7ece7; --text-muted: #9aa79d;
      --accent: #74c48a; --accent-contrast: #16261c;
      --warn: #e0a458; --warn-bg: #3a2e1a;
      --critical: #e28080; --critical-bg: #3a1f1f;
      --info: #85b7de; --info-bg: #1c2c3a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121814; --surface: #1b231d; --surface-2: #212b23; --border: #303c33;
    --text: #e7ece7; --text-muted: #9aa79d;
    --accent: #74c48a; --accent-contrast: #16261c;
    --warn: #e0a458; --warn-bg: #3a2e1a;
    --critical: #e28080; --critical-bg: #3a1f1f;
    --info: #85b7de; --info-bg: #1c2c3a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
  .app { max-width: 900px; margin: 0 auto; padding: 24px 16px 56px; }
  .masthead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .02em; color: var(--accent); }
  .subhead { color: var(--text-muted); font-size: 13px; }
  .matchup {
    margin: 16px 0 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .matchup .side { text-align: center; }
  .matchup .team-name { font-weight: 700; }
  .matchup .proj { font-family: var(--font-mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .matchup .vs { color: var(--text-muted); font-family: var(--font-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }

  h2 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .03em; font-size: 17px; color: var(--accent); margin: 28px 0 10px; }

  .changes { background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .changes ul { margin: 0; padding-left: 18px; }
  .changes li { margin: 4px 0; }
  .changes .none { color: var(--text-muted); font-style: italic; }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 480px; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  .slot-cell { font-family: var(--font-mono); color: var(--text-muted); font-size: 12px; }
  .proj-cell { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; margin-left: 6px; text-transform: uppercase; }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.short { background: var(--warn-bg); color: var(--warn); }
  .tag.ok { background: var(--surface-2); color: var(--text-muted); }
  .tag.full { background: var(--surface-2); color: var(--text-muted); opacity: .7; }
  .tag.moveup { background: var(--accent-contrast); color: var(--accent); }
  .tag.movedown { background: var(--critical-bg); color: var(--critical); }
  .move-note { color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }

  .waiver-group { margin-bottom: 18px; }
  .waiver-group h3 { font-family: var(--font-display); font-size: 14px; letter-spacing: .03em; margin: 0 0 6px; display: flex; align-items: center; }

  footer.note { margin-top: 28px; font-size: 11px; color: var(--text-muted); text-align: center; }
</style>
</head>

  function moveBadge(move) {
    // Inline "(+3)"/"(-5)"/"(NEW)" next to a rank/ownership number, showing
    // how it's moved since the last report - a move at or past the
    // notable threshold (see snapshot.py) gets a colored pill; a smaller
    // move still shows, just quieter, so nothing is hidden, only
    // de-emphasized.
    if (!move) return "";
    if (move.dir === "new") {
      return ' <span class="tag warn">(NEW)</span>';
    }
    var text = "(" + move.text + ")";
    if (move.notable) {
      return ' <span class="tag ' + (move.dir === "down" ? "movedown" : "moveup") + '">' + text + '</span>';
    }
    return ' <span class="move-note">' + text + '</span>';
  }
